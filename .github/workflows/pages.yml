name: Test and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # lets the test save its results to the ci-results branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test at phone size (pretend Google Drive)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: |
          pip install pillow
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Shared logic
        run: |
          mkdir -p tests/out
          set -o pipefail
          node --test tests/core.test.mjs 2>&1 | tee tests/out/core.log
      - name: The app at iPhone size
        run: |
          set -o pipefail
          node --test tests/phone.e2e.mjs 2>&1 | tee tests/out/e2e.log
      - name: Save results to the ci-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tests/out
          echo "run $GITHUB_RUN_ID, commit $GITHUB_SHA, job status ${{ job.status }}" > RUN.txt
          git init -q -b results
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -q -m "Phone test results for run $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" results:ci-results/phone

  publish:
    name: Publish on GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Only the app's files
        run: |
          mkdir _site
          cp -r index.html app.js core.js drive.js board.js config.js styles.css manifest.webmanifest assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
