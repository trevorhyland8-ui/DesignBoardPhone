<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Design Board">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  <title>Design Board</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <header id="top">
    <div class="banner" id="banner">
      <span class="brand">Design Board</span>
      <span class="busy" id="busy" hidden></span>
    </div>
    <div class="bar" id="bar" hidden>
      <select id="view" aria-label="Which designs to show"></select>
      <input id="search" type="search" placeholder="Search" aria-label="Search file names" enterkeyhint="search">
      <button id="refreshBtn" class="icon" aria-label="Refresh" title="Refresh">↻</button>
      <button id="menuBtn" class="icon" aria-label="Menu" title="Menu">⋯</button>
    </div>
    <div class="progress" id="progress" hidden><span id="progressText"></span></div>
    <div class="notice" id="notice" hidden></div>
  </header>

  <main id="board" class="bg-checker"></main>
  <footer id="foot" hidden></footer>

  <section id="splash" class="splash">
    <div class="panel">
      <div id="splashText">Loading…</div>
      <div class="splash-actions" id="splashActions"></div>
    </div>
  </section>

  <section id="viewer" class="viewer" hidden>
    <div class="viewer-top">
      <button class="icon light" id="viewerClose" aria-label="Close">✕</button>
      <div class="viewer-title" id="viewerTitle"></div>
      <button class="icon light" id="viewerBg" aria-label="Background" title="Background">◐</button>
    </div>
    <div class="viewer-strip" id="viewerStrip"></div>
    <div class="viewer-panel" id="viewerPanel"></div>
  </section>

  <div class="sheet-back" id="sheetBack" hidden></div>
  <section class="sheet" id="sheet" hidden>
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon" id="sheetClose" aria-label="Close">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastAction" hidden></button></div>

  <script type="module" src="app.js"></script>
</body>
</html>
